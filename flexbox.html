<!DOCTYPE html>
<html>
    <head>
        <style>
            .flex-container{
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                width: 600px;
                background-color: blue;
                padding: 20px;
            }
            .flex-container div {
                width: 100px;
                background-color: white;
                margin: 5px;
                padding: 5px;
            }
        </style>
    </head>
    <body>
        <div class="flex-container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </body>
</html>
